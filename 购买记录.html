<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>购买记录 - 离泰数链</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            margin: 0 auto;
        }
        .content-area { flex: 1; padding: 0 0 24px; }

        .top-nav {
            height: 50px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-nav .back-btn {
            width: 32px; height: 32px;
            border-radius: 50%; border: none;
            background: #f5f5f5;
            font-size: 18px; color: #666;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .top-nav .back-btn:active { background: #e8e8e8; }
        .top-nav .title {
            flex: 1; text-align: center;
            font-size: 17px; font-weight: 600; color: #333;
            padding-right: 32px;
        }

        /* 点数余额卡 */
        .balance-card {
            background: linear-gradient(135deg, #0669FF, #4A90FF);
            margin: 12px 16px;
            border-radius: 14px;
            padding: 18px 20px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .balance-card .bc-label { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
        .balance-card .bc-value { font-size: 26px; font-weight: 700; }
        .balance-card .bc-value span { font-size: 14px; font-weight: 500; margin-left: 4px; }
        .balance-card .bc-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }
        .balance-card .bc-btn:active { background: rgba(255,255,255,0.3); }

        .record-list { padding: 0 16px; }
        .record-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .record-card .rc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .record-card .rc-top .rc-id {
            font-size: 12px;
            color: #999;
            font-family: monospace;
        }
        .record-card .rc-top .rc-status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: 500;
        }
        .record-card .rc-top .rc-status.success { background: #E8F5E9; color: #34c759; }
        .record-card .rc-top .rc-status.pending { background: #FFF7E6; color: #E6A23C; }
        .record-card .rc-top .rc-status.refunding { background: #FFF0F0; color: #D43828; }
        .record-card .rc-top .rc-status.refunded { background: #f5f5f7; color: #999; }
        .record-card .rc-top .rc-status .rc-status-btn { display: inline-block; margin-left: 8px; }

        .record-card .rc-pay-row { margin-top: 10px; text-align: right; }
        .record-card .rc-pay-row .rc-pay-btn {
            font-size: 12px;
            padding: 6px 20px;
            border-radius: 20px;
            border: none;
            background: #0669FF;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
        }
        .record-card .rc-pay-row .rc-pay-btn:active { background: #0056cc; }

        .record-card .rc-body {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .record-card .rc-body .rc-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: #E8F0FE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #0669FF;
            flex-shrink: 0;
        }
        .record-card .rc-body .rc-info { flex: 1; }
        .record-card .rc-body .rc-info .rc-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .record-card .rc-body .rc-info .rc-meta {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .record-card .rc-body .rc-price {
            font-size: 18px;
            font-weight: 700;
            color: #E53935;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: #bbb;
            font-size: 14px;
        }

        /* ── 功能说明面板 ── */
        .doc-panel { width: 560px; background: #fff; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,.08); padding: 24px 28px; max-height: calc(100vh - 40px); overflow-y: auto; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Arial, sans-serif; line-height: 1.7; font-size: 14px; color: #333; position: absolute; left: calc(50% + 365px); top: 20px; }
        .doc-panel::-webkit-scrollbar { width: 5px; }
        .doc-panel::-webkit-scrollbar-thumb { background: #d0d5e0; border-radius: 3px; }
        .doc-panel .doc-title { font-size: 20px; font-weight: 700; color: #1F3864; border-bottom: 2px solid #2E75B6; padding-bottom: 10px; margin-bottom: 16px; }
        .doc-panel h3 { font-size: 16px; font-weight: 600; color: #2E75B6; margin: 16px 0 8px; }
        .doc-panel h4 { font-size: 14px; font-weight: 600; color: #333; margin: 12px 0 6px; }
        .doc-panel p { font-size: 13px; color: #555; margin-bottom: 6px; }
        .doc-panel ul { padding-left: 20px; margin: 4px 0 8px; }
        .doc-panel li { margin-bottom: 3px; font-size: 13px; color: #555; }
        @media (max-width: 1200px) { .page-wrap { flex-wrap: wrap; } .doc-panel { position: static; width: 100%; max-width: 430px; max-height: none; margin-top: 20px; } }

        @media (max-width: 430px) { .app-container { max-width: 100%; } }
    </style>
</head>
<body>
<div class="page-wrap" style="display:flex;justify-content:center;position:relative;">
<div class="app-container">
        <div class="top-nav">
            <button class="back-btn" onclick="goBack()">‹</button>
            <div class="title">购买记录</div>
        </div>

    <div class="content-area">
        <!-- 点数余额 -->
        <div class="balance-card">
            <div>
                <div class="bc-label">当前点数</div>
                <div class="bc-value" id="balanceValue">0<span>点</span></div>
            </div>
            <button class="bc-btn" onclick="goBuy()">去充值</button>
        </div>

        <div class="record-list" id="recordList"></div>
    </div>
</div>

<div class="doc-panel">
    <div class="doc-title">购买记录 - 功能说明</div>

    <h3>1. 点数余额</h3>
    <ul>
        <li>顶部显示用户当前账户点数余额，点击「去充值」跳转到购买点数页面</li>
    </ul>

    <h3>2. 购买记录</h3>
    <ul>
        <li>按时间倒序展示所有充值记录，记录类型为「点数套餐」</li>
        <li>每条记录显示订单编号、套餐名称（点数）、支付金额、充值时间、订单状态</li>
        <li>状态标识：支付成功（绿色）、待支付（橙色）、退款中（红色）、退款成功（灰色）</li>
        <li>待支付订单展示「去支付」按钮，点击进入支付流程</li>
    </ul>
</div>
</div>

<script>
    var statusMap = { success: '支付成功', pending: '待支付', refunding: '退款中', refunded: '退款成功' };
    var planIconMap = { '50 点': '50', '150 点': '150', '500 点': '500', '1000 点': '1000' };

    function goBack() {
        window.location.href = '购买次数_v2.html';
    }
    function goBuy() {
        window.location.href = '购买次数_v2.html';
    }

    // 当前点数余额（可从 localStorage 读取购买次数_v2 存储）
    function getBalance() {
        var saved = localStorage.getItem('aiPointBalance');
        if (saved) return parseInt(saved, 10) || 0;
        // 默认示例余额
        return 1230;
    }

    var mockRecords = [
        { id: 'P20260715001', planName: '1000 点', quantity: 1000, total: 698.00, time: '2026-07-15 10:30', status: 'success' },
        { id: 'P20260714002', planName: '500 点', quantity: 500, total: 398.00, time: '2026-07-14 14:20', status: 'success' },
        { id: 'P20260712003', planName: '150 点', quantity: 150, total: 138.00, time: '2026-07-12 09:15', status: 'pending' },
        { id: 'P20260710004', planName: '50 点', quantity: 50, total: 49.90, time: '2026-07-10 16:00', status: 'success' },
        { id: 'P20260708005', planName: '500 点', quantity: 500, total: 398.00, time: '2026-07-08 11:30', status: 'refunding' },
        { id: 'P20260706006', planName: '150 点', quantity: 150, total: 138.00, time: '2026-07-06 08:00', status: 'refunded' },
    ];

    function renderRecords() {
        var list = document.getElementById('recordList');
        if (mockRecords.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无购买记录</div>';
            return;
        }

        var html = '';
        for (var i = 0; i < mockRecords.length; i++) {
            var r = mockRecords[i];
            var icon = planIconMap[r.planName] || '🪙';
            var payRow = '';
            if (r.status === 'pending') {
                payRow = '<div class="rc-pay-row"><button class="rc-pay-btn" onclick="payOrder(\'' + r.id + '\')">去支付</button></div>';
            }
            html += '<div class="record-card">'
                + '<div class="rc-top">'
                + '<span class="rc-id">' + r.id + '</span>'
                + '<span class="rc-status ' + r.status + '">' + statusMap[r.status] + '</span>'
                + '</div>'
                + '<div class="rc-body">'
                + '<div class="rc-icon">' + icon + '</div>'
                + '<div class="rc-info">'
                + '<div class="rc-name">' + r.planName + ' 点数套餐</div>'
                + '<div class="rc-meta">' + r.quantity + ' 点 · ' + r.time + '</div>'
                + '</div>'
                + '<div class="rc-price">¥' + r.total.toFixed(2) + '</div>'
                + '</div>'
                + payRow
                + '</div>';
        }
        list.innerHTML = html;
    }

    function payOrder(id) {
        alert('去支付订单：' + id);
    }

    function loadBalance() {
        document.getElementById('balanceValue').innerHTML = getBalance() + '<span>点</span>';
    }

    loadBalance();
    renderRecords();
</script>
</body>
</html>
