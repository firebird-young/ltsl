    - generic [ref=e310]:
      - generic [ref=e311]:
        - generic [ref=e312]: 功能说明
        - button "›" [ref=e313] [cursor=pointer]
      - generic [ref=e314]:
        - heading "一、页面用途" [level=4] [ref=e315]
        - list [ref=e316]:
          - listitem [ref=e317]: 用户订单管理页以用户为单位，后台查看和管理所有订单，支持按状态筛选、按条件搜索、查看订单详情、发起退款及导出数据。
        - heading "二、状态标签页" [level=4] [ref=e318]
        - list [ref=e319]:
          - listitem [ref=e320]:
            - text: 顶部标签页按订单状态分组：
            - strong [ref=e321]: 全部 / 待成团 / 退款中 / 已退款 / 待出行 / 已核销 / 已过期
            - text: ，各标签显示对应数量，点击仅展示对应状态订单。
        - heading "三、搜索筛选" [level=4] [ref=e322]
        - list [ref=e323]:
          - listitem [ref=e324]:
            - text: 支持按
            - strong [ref=e325]: 订单编号、用户手机、课程名称、拼团订单编号、场次时间、场次名称
            - text: 精确搜索。
          - listitem [ref=e326]: 点击「查询」应用条件，「重置」清空条件。
        - heading "四、订单列表" [level=4] [ref=e327]
        - list [ref=e328]:
          - listitem [ref=e329]:
            - text: 表格展示：订单编号（可点击查看）、用户账号、
            - strong [ref=e330]: 课程
            - text: 、
            - strong [ref=e331]: 场次时间
            - text: 、
            - strong [ref=e332]: 场次名称
            - text: 、出行人 / 规格、总金额、优惠金额、实付金额、订单状态、拼团确认时间、下单时间、关联拼团，共 13 个数据列。
          - listitem [ref=e333]: 课程与场次已拆分为三列独立展示（课程 / 场次时间 / 场次名称），不再展示课程编号（如 C1002）等内部编号。
          - listitem [ref=e334]:
            - strong [ref=e335]: 出行人 / 规格
            - text: 列合并展示：每个出行人单独一行，包含姓名 + 性别 + 类型标签（
            - strong [ref=e336]: 学生 / 家长
            - text: ）及其规格与单价（如：李浩宇 学生带午餐 ¥199），不重复展示数量。
        - heading "五、订单详情" [level=4] [ref=e337]
        - list [ref=e338]:
          - listitem [ref=e339]:
            - text: 点击订单编号或「查看」弹出详情弹窗，包含：
            - strong [ref=e340]: 订单信息
            - text: （编号、状态、金额、下单 / 拼团确认时间等）、
            - strong [ref=e341]: 用户与出行人
            - text: （用户账号、联系手机号、出行人）、
            - strong [ref=e342]: 课程信息
            - text: 、
            - strong [ref=e343]: 关联拼团
            - text: （拼团编号与状态）。
        - heading "六、退款操作" [level=4] [ref=e344]
        - list [ref=e345]:
          - listitem [ref=e346]:
            - text: 非退款 / 已退款状态订单提供「退款」按钮，弹窗填写
            - strong [ref=e347]: 退款比例（%）
            - text: 与
            - strong [ref=e348]: 退款备注
            - text: ，确认后进入「退款中」并自动转为「已退款」。
          - listitem [ref=e349]: 「退款中」「已退款」订单提供「退款信息」查看，展示退款流水号、状态、备注、退款时间、到账时间、付款 / 退款金额。
        - heading "七、数据导出" [level=4] [ref=e350]
        - list [ref=e351]:
          - listitem [ref=e352]:
            - text: 「导出」按钮按
            - strong [ref=e353]: 当前查询结果
            - text: 导出：同时应用所选状态标签页与全部筛选条件（订单编号 / 用户手机 / 课程名称 / 拼团编号 / 场次时间 / 场次名称），导出的数据与页面所见完全一致。
          - listitem [ref=e354]:
            - text: 导出
            - strong [ref=e355]: 列与页面表格完全一致
            - text: （不含「操作」列）：订单编号、用户账号、课程、场次时间、场次名称、出行人 / 规格、总金额、优惠金额、实付金额、订单状态、拼团确认时间、下单时间、关联拼团，共 13 列；表格之外的其他字段不导出。
          - listitem [ref=e356]:
            - text: 「出行人 / 规格」单元格内若有
            - strong [ref=e357]: 多个出行人
            - text: ，在单元格内
            - strong [ref=e358]: 逐行换行
            - text: 展示，便于逐人核对（Excel 中若未自动换行，可对该列开启「自动换行」）。
          - listitem [ref=e359]:
            - text: 导出格式为 CSV（UTF-8 BOM，Excel 可直接打开），文件名带导出时间戳，如
            - strong [ref=e360]: 用户订单管理_20260910_1530.csv
            - text: ；查询结果为空时提示「暂无可导出的数据」。