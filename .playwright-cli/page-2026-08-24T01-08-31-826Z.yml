    - generic [ref=e245]:
      - generic [ref=e246]: 📖 功能说明
      - button "✕" [ref=e247] [cursor=pointer]
    - generic [ref=e248]:
      - paragraph [ref=e249]:
        - text: 课程发布页用于管理员创建研学课程，填写基本信息、销售设置（含自助核销与场次方案）后暂存或发布。本次仅新增
        - strong [ref=e250]: 自助核销
        - text: 与
        - strong [ref=e251]: 场次方案
        - text: 两个功能点。
      - heading "一、自助核销" [level=4] [ref=e252]
      - list [ref=e253]:
        - listitem [ref=e254]:
          - text: 位于"销售设置"中，开关为
          - strong [ref=e255]: 不开启 / 开启
          - text: 二选一。
        - listitem [ref=e256]:
          - strong [ref=e257]: 不开启
          - text: ：用户端订单页不展示滑动核销，出行前仅按活动时间到场参与。
        - listitem [ref=e258]:
          - strong [ref=e259]: 开启
          - text: ：展开"课程开始前
          - strong [ref=e260]: X
          - text: 天"步进器，用于设置自主核销的
          - strong [ref=e261]: 开放时间
          - text: （即出行前 X 天起，用户可在订单详情页滑动核销）。
        - listitem [ref=e262]: 开启后，达到开放时间的订单会展示滑动核销入口，核销后用户进入研学企微群。
      - heading "二、场次方案" [level=4] [ref=e263]
      - list [ref=e264]:
        - listitem [ref=e265]:
          - text: 必填项。通过右上角"
          - strong [ref=e266]: + 新增场次
          - text: "\"按钮打开弹窗，场次列表表格展示："
          - strong [ref=e267]: 场次名称 / 时间 / 成团规则 / 规格和价格 / 操作
          - text: （修改、删除）。
        - listitem [ref=e268]:
          - text: 弹窗分三步设置：
          - list [ref=e269]:
            - listitem [ref=e270]:
              - strong [ref=e271]: ① 基础信息
              - text: ：填写场次名称；点击时间框弹出日历，
              - strong [ref=e272]: 支持多选、可离散选择
              - text: 日期。
            - listitem [ref=e273]:
              - strong [ref=e274]: ② 规格设置
              - text: ：
              - strong [ref=e275]: 主类型默认存在
              - text: （如：学生），可"添加其他类型"（如：家长）；每个类型下可添加多个规格，配置
              - strong [ref=e276]: 规格名称、价格（元/人）、年龄限制
              - text: （可启用起止年龄段）。
            - listitem [ref=e277]:
              - strong [ref=e278]: ③ 成团规则
              - text: ：按主类型所有规格购买数量合计计算——设置最低成团人数与购买上限人数；设置活动开始前最晚确认 X 天。