            id: 'P260820036767004', courseNo: 'C1004', course: '博物馆奇妙日', session: '2026-08-10 上午场', courseTime: '2026-08-10',
            verifyInstitution: '江苏省文旅集团', execInstitution: '南京研学基地',
            minOrder: 8, maxOrder: 15, mainOrder: 8, otherOrder: 2, confirmDate: '2026-08-08 18:00',
            status: 'done', createTime: '2026-08-01 10:00:00', amount: 1990.00, groupTime: '2026-08-02 10:30:00',
            orders: [
                { orderId: 'U260820036767031', buyTime: '2026-08-01 10:00:00', phone: '15000150001', travelers: [{ name: '张小明', type: 'main', gender: '男', age: 11, idCard: '330102201511120045' }, { name: '张小明家长', type: 'other', gender: '男', age: 40, idCard: '330102198602200067' }], amount: 398.00, status: '已核销' },
                { orderId: 'U260820036767032', buyTime: '2026-08-01 10:03:00', phone: '15100151001', travelers: [{ name: '家长A小孩', type: 'main', gender: '女', age: 10, idCard: '350103201601050089' }], amount: 199.00, status: '已核销' },
                { orderId: 'U260820036767033', buyTime: '2026-08-01 10:08:00', phone: '15200152001', travelers: [{ name: '家长B小孩', type: 'main', gender: '男', age: 9, idCard: '420106201703200012' }], amount: 199.00, status: '已核销' },
                { orderId: 'U260820036767034', buyTime: '2026-08-01 10:12:00', phone: '15300153001', travelers: [{ name: '家长C小孩', type: 'main', gender: '女', age: 12, idCard: '510108201404180034' }, { name: '家长C', type: 'other', gender: '女', age: 38, idCard: '510108198608120056' }], amount: 398.00, status: '已核销' },
                { orderId: 'U260820036767035', buyTime: '2026-08-01 10:15:00', phone: '15400154001', travelers: [{ name: '家长D小孩', type: 'main', gender: '男', age: 11, idCard: '440305201503150078' }], amount: 199.00, status: '已核销' },
                { orderId: 'U260820036767036', buyTime: '2026-08-01 10:20:00', phone: '15500155001', travelers: [{ name: '家长E小孩', type: 'main', gender: '女', age: 10, idCard: '330102201601200090' }], amount: 199.00, status: '已核销' },
                { orderId: 'U260820036767037', buyTime: '2026-08-01 10:25:00', phone: '15600156001', travelers: [{ name: '家长F小孩', type: 'main', gender: '男', age: 9, idCard: '350103201702010011' }], amount: 199.00, status: '已核销' },
                { orderId: 'U260820036767038', buyTime: '2026-08-01 10:30:00', phone: '15700157001', travelers: [{ name: '家长G小孩', type: 'main', gender: '女', age: 12, idCard: '420106201408220022' }], amount: 199.00, status: '已核销' }
            ]
        }
    ];

    var currentTab = 'all';

    var statusMap = {
        wait: { label: '待成团', cls: 'status-wait' },
        fail: { label: '拼团失败', cls: 'status-fail' },
        active: { label: '待出行', cls: 'status-active' },
        done: { label: '已完成', cls: 'status-done' }
    };

    function esc(s) { return String(s || '').replace(/</g, '&lt;'); }

    function updateBadges() {
        var counts = { all: groups.length, wait: 0, fail: 0, active: 0, done: 0 };
        groups.forEach(function(g) { counts[g.status] = (counts[g.status] || 0) + 1; });
        for (var k in counts) {
            var el = document.getElementById('badge' + k.charAt(0).toUpperCase() + k.slice(1));
            if (el) el.textContent = counts[k];
        }
    }

    function switchTab(el) {
        document.querySelectorAll('#tabBar .tab').forEach(function(t) { t.classList.remove('active'); });
        el.classList.add('active');
        currentTab = el.dataset.status;
        renderTable();
    }

    function renderTable() {
        var tbody = document.getElementById('groupTableBody');
        var fId = document.getElementById('filterId').value.trim();
        var fCourse = document.getElementById('filterCourse').value.trim();
        var fDate = document.getElementById('filterDate').value;
        var list = groups.filter(function(g) {
            if (currentTab !== 'all' && g.status !== currentTab) return false;
            if (fId && g.id.indexOf(fId) === -1) return false;
            if (fCourse && g.course.indexOf(fCourse) === -1) return false;
            if (fDate && g.courseTime !== fDate) return false;
            return true;
        });
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="13" class="empty-state">暂无拼团订单</td></tr>';
            return;
        }
        var html = '';
        list.forEach(function(g) {
            var s = statusMap[g.status];
            var percent = Math.min(100, (g.mainOrder / g.minOrder) * 100);
            var totalCount = g.mainOrder + g.otherOrder;
            var groupTimeTxt = g.groupTime || '—';
            html += '<tr>'
                + '<td><a href="javascript:;" onclick="showDetail(\'' + g.id + '\')" style="color:#0669FF;text-decoration:none;">' + g.id + '</a></td>'
                + '<td><div style="font-weight:500;">' + esc(g.course) + '</div><div style="font-size:12px;color:#888;margin-top:2px;">' + esc(g.courseNo) + ' / ' + esc(g.session) + '</div></td>'
                + '<td>' + esc(g.verifyInstitution) + '</td>'
                + '<td>' + esc(g.execInstitution) + '</td>'
                + '<td>最低 ' + g.minOrder + ' 人 / 最高 ' + g.maxOrder + ' 人</td>'
                + '<td><div class="progress"><div class="bar"><div class="fill" style="width:' + percent + '%;"></div></div><div class="text"><strong>' + g.mainOrder + '</strong>/' + g.minOrder + ' 人</div></div></td>'
                + '<td>' + g.otherOrder + ' 人</td>'
                + '<td>' + totalCount + ' 人</td>'
                + '<td class="price">¥' + g.amount.toFixed(2) + '</td>'
                + '<td><span class="status-tag ' + s.cls + '">' + s.label + '</span></td>'
                + '<td>' + groupTimeTxt + '</td>'
                + '<td>' + g.createTime + '</td>'
                + '<td>' + buildActions(g) + '</td></tr>';
        });
        tbody.innerHTML = html;
    }

    function buildActions(g) {
        var html = '<button class="action-btn btn-view" onclick="showDetail(\'' + g.id + '\')">查看</button>';
        if (g.status === 'wait') {
            html += '<button class="action-btn btn-finish" onclick="finishGroup(\'' + g.id + '\')">手动完成</button>';
        } else if (g.status === 'active') {
            html += '<button class="action-btn btn-remind" onclick="sendRemind(\'' + g.id + '\')">发送提醒</button>';
            html += '<button class="action-btn btn-view" onclick="reportManage(\'' + g.id + '\')">研学报告管理</button>';
        } else if (g.status === 'done') {
            html += '<button class="action-btn btn-view" onclick="reportManage(\'' + g.id + '\')">研学报告管理</button>';
        }
        html += '<button class="action-btn btn-verify" onclick="openQrModal(\'' + g.id + '\')">企微群</button>';
        return html;
    }

    function sendRemind(id) {
        if (!confirm('确定向该拼团发送出行提醒吗？')) return;
        alert('已发送出行提醒');
    }
    function finishGroup(id) {
        if (!confirm('确定手动完成该拼团？')) return;
        var g = groups.find(function(x) { return x.id === id; });
        if (g) { g.status = 'done'; g.groupTime = new Date().toLocaleString('zh-CN', { hour12: false }); updateBadges(); renderTable(); }
        alert('拼团已标记为完成');
    }
    function reportManage(id) {
        alert('打开研学报告管理：' + id);
    }

    function showDetail(id) {
        var g = groups.find(function(x) { return x.id === id; });
        if (!g) return;
        var s = statusMap[g.status];

        // 已拼订单列表
        var orderHtml = '';
        g.orders.forEach(function(o) {
            var travelerHtml = o.travelers.map(function(t) {
                var isStudent = t.type === 'main';
                var meta = '';
                if (t.gender) meta += ' ' + esc(t.gender);
                if (t.age !== undefined && t.age !== null) meta += ' ' + t.age + '岁';
                var idCard = t.idCard || '';
                return '<div class="tv"><span class="tv-name">' + esc(t.name) + '</span><span class="type-tag ' + (isStudent ? 'student' : 'parent') + '">' + (isStudent ? '学生' : '家长') + '</span>'
                    + '<span class="tv-meta">' + meta + '</span><span class="tv-idcard">' + esc(idCard) + '</span></div>';
            }).join('');
            orderHtml += '<tr>'
                + '<td>' + esc(o.orderId) + '</td>'
                + '<td>' + esc(o.buyTime) + '</td>'
                + '<td>' + esc(o.phone) + '</td>'
                + '<td><div class="traveler-list">' + travelerHtml + '</div></td>'
                + '<td class="price">¥' + o.amount.toFixed(2) + '</td>'
                + '<td>' + esc(o.status) + '</td></tr>';
        });

        document.getElementById('detailBody').innerHTML =
            '<div class="detail-section">'
            + '<div class="sec-title">拼团信息</div>'
            + '<div class="detail-row"><span class="label">拼团编号</span><span class="value">' + g.id + '</span></div>'
            + '<div class="detail-row"><span class="label">拼团状态</span><span class="value"><span class="status-tag ' + s.cls + '">' + s.label + '</span></span></div>'
            + '<div class="detail-row"><span class="label">成团人数要求</span><span class="value">最低 ' + g.minOrder + ' 人 / 最高 ' + g.maxOrder + ' 人</span></div>'
            + '<div class="detail-row"><span class="label">拼团进度</span><span class="value">' + g.mainOrder + ' / ' + g.minOrder + ' 人</span></div>'
            + '<div class="detail-row"><span class="label">其他成员数</span><span class="value">' + g.otherOrder + ' 人</span></div>'
            + '<div class="detail-row"><span class="label">总成员数</span><span class="value">' + (g.mainOrder + g.otherOrder) + ' 人</span></div>'
            + '<div class="detail-row"><span class="label">成团时间</span><span class="value">' + (g.groupTime || '—') + '</span></div>'
            + '<div class="detail-row"><span class="label">拼团确认时间</span><span class="value">' + g.confirmDate + '</span></div>'
            + (g.failReason ? '<div class="detail-row"><span class="label">失败原因</span><span class="value" style="color:#CF1322;">' + esc(g.failReason) + '</span></div>' : '')
            + '</div>'
            + '<div class="detail-section">'
            + '<div class="sec-title">课程信息</div>'
            + '<div class="detail-row"><span class="label">课程编号</span><span class="value">' + esc(g.courseNo) + '</span></div>'
            + '<div class="detail-row"><span class="label">课程名称</span><span class="value">' + esc(g.course) + '</span></div>'
            + '<div class="detail-row"><span class="label">场次时间</span><span class="value">' + esc(g.session) + '</span></div>'
            + '<div class="detail-row"><span class="label">核验机构</span><span class="value">' + esc(g.verifyInstitution) + '</span></div>'
            + '<div class="detail-row"><span class="label">执行机构</span><span class="value">' + esc(g.execInstitution) + '</span></div>'
            + '</div>'
            + '<div class="detail-section">'
            + '<div class="sec-title">已拼订单（' + g.orders.length + '）</div>'
            + '<div class="order-table-wrap"><table class="order-table"><thead><tr>'
            + '<th>订单编号</th><th>购买时间</th><th>购买手机号</th><th>出行人员</th><th>付款金额</th><th>状态</th>'
            + '</tr></thead><tbody>' + orderHtml + '</tbody></table></div>'
            + '</div>';
        document.getElementById('detailModal').classList.add('show');
    }
    function closeDetailModal() { document.getElementById('detailModal').classList.remove('show'); }
    function closeModalByOverlay(e) { if (e.target === document.getElementById('detailModal')) closeDetailModal(); }

    function resetFilter() {
        document.getElementById('filterId').value = '';
        document.getElementById('filterCourse').value = '';
        document.getElementById('filterDate').value = '';
        renderTable();
    }

    function exportGroups() {
        var list = groups.filter(function(g) { return currentTab === 'all' || g.status === currentTab; });
        if (list.length === 0) { alert('暂无数据可导出'); return; }
        var header = ['拼团编号', '课程编号', '课程名称', '场次', '核验机构', '执行机构', '最低成团人数', '最高成团人数', '拼团进度(主类型)', '其他成员数', '总成员数', '实付总额', '拼团状态', '成团时间', '拼团确认时间', '下单时间'];
        var rows = list.map(function(g) {
            return [g.id, g.courseNo, g.course, g.session, g.verifyInstitution, g.execInstitution, g.minOrder, g.maxOrder, g.mainOrder, g.otherOrder, (g.mainOrder + g.otherOrder), g.amount, statusMap[g.status].label, g.groupTime || '', g.confirmDate, g.createTime];
        });
        downloadCsv('拼团订单管理.csv', header, rows);
    }

    function downloadCsv(filename, header, rows) {
        var lines = [header.join(',')];
        rows.forEach(function(r) {
            lines.push(r.map(function(c) {
                c = String(c == null ? '' : c);
                return '"' + c.replace(/"/g, '""') + '"';
            }).join(','));
        });
        var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    /* 企微群上传 */
    var currentQrGroupId = null;
    function openQrModal(id) {
        currentQrGroupId = id;
        document.getElementById('qrPreview').style.display = 'none';
        document.getElementById('qrUploadHint').style.display = 'block';
        document.getElementById('qrFileInput').value = '';
        var g = groups.find(function(x) { return x.id === id; });
        if (g && g.qrImage) {
            document.getElementById('qrPreview').src = g.qrImage;
            document.getElementById('qrPreview').style.display = 'block';
            document.getElementById('qrUploadHint').style.display = 'none';
        }
        document.getElementById('qrModal').classList.add('show');
    }
    function closeQrModal() { document.getElementById('qrModal').classList.remove('show'); currentQrGroupId = null; }
    function closeQrModalByOverlay(e) { if (e.target === document.getElementById('qrModal')) closeQrModal(); }
    function previewQr(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('qrPreview').src = e.target.result;
            document.getElementById('qrPreview').style.display = 'block';
            document.getElementById('qrUploadHint').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
    function saveQr() {
        var g = groups.find(function(x) { return x.id === currentQrGroupId; });
        var preview = document.getElementById('qrPreview');
        if (preview.style.display !== 'none' && preview.src) {
            if (g) g.qrImage = preview.src;
        }
        closeQrModal();
        alert('企微群图片已保存');
    }

    updateBadges();
    renderTable();
</script>
