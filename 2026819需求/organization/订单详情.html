<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            position: relative;
            background: #f5f5f5;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            padding-bottom: 24px;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 16px;
        }
        .status-bar .time {
            position: absolute;
            left: 20px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        .status-bar .icons {
            position: absolute;
            right: 16px;
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 14px;
            color: #333;
        }

        /* 顶部导航 */
        .top-nav {
            height: 50px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .top-nav .back-btn {
            position: absolute;
            left: 12px;
            font-size: 26px;
            color: #333;
            cursor: pointer;
        }
        .top-nav .title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .top-nav .right-actions {
            position: absolute;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav .right-actions span {
            font-size: 20px;
            color: #333;
            cursor: pointer;
        }

        /* 场次信息卡 */
        .session-header {
            background: #FFF7E6;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            color: #333;
        }
        .session-header .status-tag {
            background: #FFE2BF;
            color: #D48806;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        .course-card {
            background: #fff;
            margin: 12px 16px 0;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 12px;
        }
        .course-card .course-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a2a3a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }
        .course-card .course-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .course-card .course-info .name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .course-card .course-info .org {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }
        .course-card .course-info .count {
            font-size: 13px;
            color: #333;
        }
        .course-card .report-btn {
            align-self: center;
            flex-shrink: 0;
            height: 32px;
            padding: 0 14px;
            border: 1px solid #0669FF;
            border-radius: 16px;
            background: #fff;
            color: #0669FF;
            font-size: 13px;
            cursor: pointer;
        }
        .course-card .report-btn:active { background: #f0f7ff; }

        /* 联系人分组 */
        .group-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-group {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
        }
        .group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .group-head .phone-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #333;
        }
        .group-head .phone-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FFF3E0;
            color: #E65100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }
        .group-head .status-tag {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .status-pending { background: #FFE2BF; color: #D48806; }
        .status-verified { background: #B7E5C2; color: #2DA666; }
        .status-expired { background: #E0E0E0; color: #888; }

        .traveler-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .traveler-row {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
        }
        .traveler-row .tr-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .traveler-row .tr-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .traveler-row .name { color: #333; font-weight: 500; }
        .traveler-row .gender { color: #999; font-size: 13px; }
        .traveler-row .type-tag {
            display: inline-block;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
            line-height: 1.5;
            font-weight: 500;
            white-space: nowrap;
        }
        .type-tag.student { background: #E8F5E9; color: #389E0D; border: 1px solid #B7EB8F; }
        .type-tag.parent { background: #FFF7E6; color: #D48806; border: 1px solid #FFD591; }
        .traveler-row .id-card {
            color: #999;
            font-size: 13px;
            margin-top: 6px;
        }
        .traveler-row .tr-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .traveler-row .action-btn {
            height: 26px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #555;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .traveler-row .action-btn.btn-eval {
            border-color: #0669FF;
            color: #0669FF;
        }
        .traveler-row .action-btn.btn-ai {
            border-color: #B8860B;
            color: #B8860B;
        }
        .traveler-row .action-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <span class="time">14:18</span>
            <div class="icons">
                <span>5G</span>
                <span>5G</span>
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="top-nav">
            <span class="back-btn">‹</span>
            <span class="title">订单详情</span>
            <div class="right-actions">
                <span>•••</span>
                <span>◉</span>
            </div>
        </div>

        <div class="session-header">
            <span class="date">2026年08月18日</span>
            <span class="status-tag">待出行</span>
        </div>

        <div class="course-card">
            <div class="course-img">省博探秘<br>AI赋活</div>
            <div class="course-info">
                <div class="name">省博探秘 · AI赋活</div>
                <div class="org">省博研学 · AI赋活</div>
                <div class="count">10单</div>
            </div>
            <button class="report-btn" onclick="goReport()">报告管理</button>
        </div>

        <div class="group-list" id="groupList"></div>
    </div>

    <script>
        // 每个订单下有多条用户（出行人）数据
        var groups = [
            {
                phone: '13308001898',
                status: 'pending',
                travelers: [
                    { name: '向小东', gender: '男', type: 'main', idCard: '510105**********38' },
                    { name: '向志强', gender: '男', type: 'other', idCard: '510105**********39' }
                ]
            },
            {
                phone: '18228022180',
                status: 'verified',
                travelers: [
                    { name: '刘润骞', gender: '男', type: 'main', idCard: '510106**********34' },
                    { name: '刘慧敏', gender: '女', type: 'other', idCard: '510106**********35' }
                ]
            },
            {
                phone: '18608130610',
                status: 'verified',
                travelers: [
                    { name: '王梓辰', gender: '男', type: 'main', idCard: '510302**********17' },
                    { name: '王建国', gender: '男', type: 'other', idCard: '510302**********18' }
                ]
            },
            {
                phone: '18113038800',
                status: 'expired',
                travelers: [
                    { name: '文珏宇', gender: '女', type: 'main', idCard: '511502**********58' }
                ]
            }
        ];

        var statusMap = {
            pending: { label: '待出行', cls: 'status-pending' },
            verified: { label: '已核销', cls: 'status-verified' },
            expired: { label: '已过期', cls: 'status-expired' }
        };

        function esc(s) { return String(s || '').replace(/</g, '&lt;'); }

        function renderGroups() {
            var list = document.getElementById('groupList');
            var html = '';
            groups.forEach(function(g) {
                var st = statusMap[g.status];
                var travelersHtml = g.travelers.map(function(t) {
                    var isStudent = t.type === 'main';
                    var typeTag = '<span class="type-tag ' + (isStudent ? 'student' : 'parent') + '">' + (isStudent ? '学生' : '家长') + '</span>';
                    var actionsHtml = '';
                    if (isStudent && (g.status === 'verified' || g.status === 'expired')) {
                        actionsHtml = '<div class="tr-actions">'
                            + '<button class="action-btn btn-eval" onclick="doEvaluate(\'' + esc(t.name) + '\')">评价</button>'
                            + '<button class="action-btn btn-ai" onclick="doAiCreate(\'' + esc(t.name) + '\')">AI创作</button>'
                            + '</div>';
                    }
                    return '<div class="traveler-row">'
                        + '<div class="tr-top">'
                        + '<div class="tr-left"><span class="name">' + esc(t.name) + '</span>'
                        + '<span class="gender">' + esc(t.gender) + '</span>' + typeTag + '</div>'
                        + actionsHtml
                        + '</div>'
                        + '<div class="id-card">' + esc(t.idCard) + '</div>'
                        + '</div>';
                }).join('');
                html += '<div class="contact-group">'
                    + '<div class="group-head">'
                    + '<div class="phone-wrap"><span>联系电话</span><span>' + esc(g.phone) + '</span><span class="phone-icon">📞</span></div>'
                    + '<span class="status-tag ' + st.cls + '">' + st.label + '</span>'
                    + '</div>'
                    + '<div class="traveler-list">' + travelersHtml + '</div>'
                    + '</div>';
            });
            list.innerHTML = html;
        }

        function doEvaluate(name) {
            location.href = '研学用户评价.html?name=' + encodeURIComponent(name);
        }
        function doAiCreate(name) {
            location.href = '../../AI创作_v3.html?name=' + encodeURIComponent(name);
        }
        function goReport() {
            location.href = '研学报告管理.html';
        }

        renderGroups();
    </script>
</body>
</html>
