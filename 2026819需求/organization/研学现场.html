<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>研学现场</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        background: #F4F6FA;
        display: flex; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .app-container {
        width: 100%; max-width: 430px; min-height: 100vh;
        background: #F4F6FA;
        position: relative; padding-bottom: 90px;
    }
    /* ===== 顶部状态栏 ===== */
    .status-bar { background: #fff; padding: 14px 20px 10px; }
    .top-nav {
        display: flex; align-items: center; justify-content: space-between;
        background: #fff; padding: 4px 20px 16px;
    }
    .nav-back { font-size: 20px; color: #111; cursor: pointer; width: 28px; }
    .nav-title { font-size: 17px; font-weight: 600; color: #111; }
    .nav-right { width: 28px; }
    /* ===== 研学现场卡片 ===== */
    .scene-card { background: #fff; margin: 12px 14px 14px; border-radius: 12px; padding: 14px; }
    .section-title { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #111; margin-bottom: 4px; }
    .section-desc { font-size: 12px; color: #999; margin-bottom: 14px; }
    .sub-title { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #333; margin: 14px 0 8px; }
    .sub-title:first-of-type { margin-top: 0; }
    /* 上传网格 */
    .upload-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ug-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #F2F4F8; }
    .ug-item img, .ug-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ug-item .ug-video-tag {
        position: absolute; top: 4px; left: 4px; font-size: 10px; color: #fff;
        background: rgba(0,0,0,0.5); border-radius: 4px; padding: 1px 5px;
    }
    .ug-item .ug-del {
        position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
        border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; cursor: pointer; line-height: 1;
    }
    .ug-add {
        width: 64px; height: 64px;
        border: 1.5px dashed #C7D2E3; border-radius: 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #B0BACB; cursor: pointer; background: #FAFBFF;
    }
    .ug-add .plus { font-size: 18px; line-height: 1; }
    .ug-add .txt { font-size: 10px; margin-top: 3px; color: #A8B4C8; }
    .upload-hint { font-size: 11px; color: #BBB; margin-top: 8px; }
    /* ===== 底部固定栏 ===== */
    .bottom-bar {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 430px; background: #fff;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        box-shadow: 0 -2px 12px rgba(30, 60, 110, 0.08);
        z-index: 100;
    }
    .bottom-btn {
        width: 100%; height: 46px; border: none; border-radius: 23px;
        background: linear-gradient(90deg, #0669FF, #3D8BFF);
        color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .bottom-btn:active { opacity: 0.85; }
    .bottom-btn.saved { background: #EDF2FA; color: #8A97AC; cursor: default; }
    /* ===== Toast ===== */
    .toast {
        position: fixed; left: 50%; transform: translateX(-50%);
        top: 50%; background: rgba(17, 24, 39, 0.85); color: #fff;
        padding: 10px 20px; border-radius: 20px; font-size: 13px;
        z-index: 999; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-container">
    <div class="status-bar"></div>
    <div class="top-nav">
        <div class="nav-back" onclick="history.back()">←</div>
        <div class="nav-title">研学现场</div>
        <div class="nav-right"></div>
    </div>

    <!-- 研学现场 -->
    <div class="scene-card">
        <div class="section-title">📷 研学现场</div>
        <div class="section-desc">研学现场是所有参与人都可以看到</div>

        <div class="sub-title">🎬 视频</div>
        <div class="upload-grid" id="videoGrid"></div>
        <div class="ug-add" id="videoAdd" onclick="document.getElementById('videoInput').click()">
            <div class="plus">＋</div>
            <div class="txt">添加视频</div>
        </div>
        <div class="upload-hint">支持多选，mp4 单文件最大 20MB</div>
        <input type="file" id="videoInput" accept="video/*" multiple style="display:none;" onchange="handleVideoFiles(this.files)">

        <div class="sub-title">🖼️ 图片</div>
        <div class="upload-grid" id="imageGrid"></div>
        <div class="ug-add" id="imageAdd" onclick="document.getElementById('imageInput').click()">
            <div class="plus">＋</div>
            <div class="txt">添加图片</div>
        </div>
        <div class="upload-hint">支持多选，jpg/png 单文件最大 20MB</div>
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImageFiles(this.files)">
    </div>
</div>

<!-- 底部固定栏 -->
<div class="bottom-bar">
    <button class="bottom-btn" id="saveBtn" onclick="saveScene()">💾 保存研学现场</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const videoGrid = document.getElementById('videoGrid');
    const imageGrid = document.getElementById('imageGrid');
    const videoAdd = document.getElementById('videoAdd');
    const imageAdd = document.getElementById('imageAdd');

    let videos = [];
    let images = [];

    function renderVideos() {
        videoGrid.innerHTML = '';
        videos.forEach((src, i) => {
            const item = document.createElement('div');
            item.className = 'ug-item';
            item.innerHTML = `
                <video src="${src}" muted></video>
                <span class="ug-video-tag">视频</span>
                <span class="ug-del" onclick="deleteVideo(${i})">×</span>`;
            videoGrid.appendChild(item);
        });
        videoAdd.style.display = videos.length >= 9 ? 'none' : 'flex';
    }

    function renderImages() {
        imageGrid.innerHTML = '';
        images.forEach((src, i) => {
            const item = document.createElement('div');
            item.className = 'ug-item';
            item.innerHTML = `
                <img src="${src}" alt="">
                <span class="ug-del" onclick="deleteImage(${i})">×</span>`;
            imageGrid.appendChild(item);
        });
        imageAdd.style.display = images.length >= 9 ? 'none' : 'flex';
    }

    function handleVideoFiles(files) {
        Array.from(files).forEach(file => {
            if (videos.length >= 9) return;
            videos.push(URL.createObjectURL(file));
        });
        renderVideos();
    }

    function handleImageFiles(files) {
        Array.from(files).forEach(file => {
            if (images.length >= 9) return;
            images.push(URL.createObjectURL(file));
        });
        renderImages();
    }

    function deleteVideo(i) { videos.splice(i, 1); renderVideos(); }
    function deleteImage(i) { images.splice(i, 1); renderImages(); }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function saveScene() {
        const btn = document.getElementById('saveBtn');
        btn.classList.add('saved');
        btn.textContent = '✅ 已保存';
        showToast('研学现场已保存');
        setTimeout(() => {
            btn.classList.remove('saved');
            btn.textContent = '💾 保存研学现场';
        }, 3000);
    }
</script>
</body>
</html>
